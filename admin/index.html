<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Gamer Hub Duo</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="panel.css"></head><body><canvas id="stars"></canvas><header><a class="brand" href="../">GAMER<span>HUB</span></a><a class="admin-nav" href="../">← VER SITE</a></header><main class="panel-wrap"><div class="eyebrow">// ÁREA RESTRITA</div><h1>PAINEL <em>GAMER</em></h1><p id="notice" role="status">Conectando...</p><section id="loginSection" class="panel-card" hidden><h2>ENTRAR</h2><form id="loginForm"><label>Usuário<input name="username" autocomplete="username" required pattern="[a-zA-Z0-9_-]{3,24}" placeholder="jogador1"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label><button type="submit">ENTRAR NO PAINEL</button></form></section><section id="dashboard" hidden><div class="panel-bar"><strong id="welcome"></strong><button id="logout" type="button">SAIR</button></div><label>Editar perfil <select id="playerSelect"></select></label><section class="panel-card"><h2>PERFIL E REDES SOCIAIS</h2><form id="profileForm"><label>Nome<input name="name" maxlength="70" required></label><label>Descrição<input name="bio" maxlength="180"></label><label>Foto do perfil (URL https)<input name="avatar_url" type="url" placeholder="https://..."></label><label>Ou enviar foto do computador (máximo 5 MB)<input name="avatar_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div id="socialFields"></div><button type="submit">SALVAR PERFIL</button></form></section><section class="panel-card"><h2>ADICIONAR FOTO OU CLIPE</h2><form id="mediaForm"><label>Título<input name="title" maxlength="120" required></label><label>Tipo<select name="kind"><option value="video">Clipe / Vídeo (YouTube, Twitch etc.)</option><option value="image">Foto</option></select></label><label>Link do conteúdo (https)<input name="url" type="url" placeholder="https://..."></label><label>Ou enviar foto (máximo 5 MB)<input name="image_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><button type="submit">PUBLICAR CONTEÚDO</button></form><h3>CONTEÚDO PUBLICADO</h3><div id="mediaList"></div></section></section></main><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script defer src="../config.js"></script><script defer src="../data.js"></script><script defer src="panel.js"></script></body></html>
